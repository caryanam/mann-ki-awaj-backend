spring.application.name=Mann-Ki-Aawaj
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
music.storage.root=${MUSIC_STORAGE_ROOT:music-storage}
music.storage.audio-dir=audio
music.storage.cover-dir=covers
music.upload.max-audio-size=${MUSIC_MAX_AUDIO_SIZE:40MB}
music.upload.max-cover-size=${MUSIC_MAX_COVER_SIZE:5MB}
music.upload.user-max-pending=${MUSIC_USER_MAX_PENDING:5}
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:40MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:50MB}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.main.banner-mode=off
logging.level.root=INFO
jwt.expiration=86400000
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
 
ai.moderation.enabled=true
ai.translation.enabled=true
 
openai.api-url=https://api.openai.com/v1
openai.translation-model=gpt-4o-mini
openai.translation.model=gpt-4o-mini
openai.transcription-model=gpt-4o-mini-transcribe
openai.transcription.model=gpt-4o-mini-transcribe
openai.moderation-model=omni-moderation-latest
openai.moderation.model=omni-moderation-latest
openai.connect-timeout=5s
openai.read-timeout=30s
 
socket.io.host=0.0.0.0
 
 
