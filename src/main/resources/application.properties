spring.application.name=Mann-Ki-Aawaj
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.main.banner-mode=off
logging.level.root=INFO
jwt.expiration=86400000
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
 
ai.moderation.enabled=true
ai.translation.enabled=true
 
openai.api-url=https://api.openai.com/v1
openai.translation-model=gpt-4o-mini
openai.translation.model=gpt-4o-mini
openai.transcription-model=gpt-4o-mini-transcribe
openai.transcription.model=gpt-4o-mini-transcribe
openai.moderation-model=omni-moderation-latest
openai.moderation.model=omni-moderation-latest
openai.connect-timeout=5s
openai.read-timeout=30s
 
socket.io.host=0.0.0.0
 
 
