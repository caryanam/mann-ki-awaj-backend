spring.application.name=Mann-Ki-Aawaj
server.port=${SERVER_PORT:8080}

# Import optional .env file for local environment variables
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mann_ki_aawaj?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.main.banner-mode=off
logging.level.root=INFO

jwt.secret=${JWT_SECRET:1234567890123456789012345678901234567890123456789012345678901234}
jwt.expiration=86400000


# ===============================
# EMAIL CONFIGURATION
# ===============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ghubeniraj90@gmail.com
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# ===============================
# AI / OPENAI CONFIGURATION
# ===============================
ai.moderation.enabled=true
ai.translation.enabled=true
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1
openai.translation.model=gpt-4o-mini
openai.transcription.model=gpt-4o-mini-transcribe
openai.moderation.model=omni-moderation-latest
openai.connect-timeout=5s
openai.read-timeout=30s
