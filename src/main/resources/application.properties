spring.application.name=Mann_Ki_Avaj
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/mann_ki_aavaj?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
